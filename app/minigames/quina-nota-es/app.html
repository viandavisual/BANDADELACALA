<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="../../../">
  <title>QUINA NOTA ÉS? · BANDA DE LA CALA</title>
  <style>
    :root {
      --banda-white: #ffffff;
      --banda-paper: #fbfaf7;
      --banda-gold: #d4ac5f;
      --banda-gold-deep: #8b6228;
      --banda-gold-soft: #f5ead1;
      --banda-blue: #393a86;
      --banda-blue-deep: #27285f;
      --banda-ink: #24211f;
      --banda-muted: #716c67;
      --banda-line: #e7e2d9;
      --banda-danger: #a64f45;
      --result-good: #2f8d62;
      --result-good-deep: #1b6e49;
      --banda-radius: 24px;
      --banda-shadow-soft: 0 8px 28px rgba(73,58,35,.07);
      --banda-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --banda-font-title: Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--banda-font);
      background: linear-gradient(180deg, #fff 0%, #fff 72%, #fbfaf7 100%);
      color: var(--banda-ink);
      padding: 12px;
      overflow-x: hidden;
    }
    .screen {
      width: min(100%, 820px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .game-card {
      background: var(--banda-white);
      border: 1px solid var(--banda-line);
      border-radius: var(--banda-radius);
      box-shadow: var(--banda-shadow-soft);
    }
    .hero {
      padding: 14px 16px;
      background: linear-gradient(125deg, #fff 0%, #fffaf0 50%, #f5f5fb 100%);
      position: relative;
      overflow: hidden;
    }
    .hero::after{
      content:"";
      position:absolute;
      right:-34px;
      bottom:-34px;
      width:130px;
      height:130px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(212,172,95,.16) 0%, rgba(212,172,95,0) 72%);
      pointer-events:none;
    }
    .hero-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 154px;
      gap: 14px;
      align-items: start;
      position: relative;
      z-index: 1;
    }
    .hero-main { min-width: 0; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      margin-bottom: 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--banda-blue-deep);
    }
    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--banda-gold);
      box-shadow: 0 0 0 3px var(--banda-gold-soft);
      flex: 0 0 auto;
    }
    .title-row {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .game-logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid var(--banda-line);
      box-shadow: var(--banda-shadow-soft);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0;
      font-family: var(--banda-font-title);
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1;
      font-weight: 700;
      color: var(--banda-blue-deep);
      letter-spacing: .01em;
    }
    .hero-copy {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 64ch;
    }
    .hero-sub-main {
      color: var(--banda-muted);
      font-size: 14px;
      line-height: 1.38;
      min-height: 38px;
      font-weight: 500;
    }
    .hero-side {
      width: 154px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .points-box,
    .exit-box {
      width: 100%;
      border-radius: 16px;
      min-height: 51px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--banda-font-title);
      font-weight: 700;
    }
    .points-box {
      padding: 8px 10px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--banda-line);
      box-shadow: var(--banda-shadow-soft);
      color: var(--banda-blue-deep);
      flex-direction: column;
      gap: 2px;
    }
    .points-number {
      font-size: 48px;
      line-height: 1;
      color: var(--banda-gold-deep);
      min-height: 48px;
    }
    .points-label {
      font-size: 11px;
      line-height: 1.08;
      letter-spacing: .05em;
      min-height: 12px;
    }
    .exit-box {
      border: 1px solid rgba(166,79,69,.25);
      background: #fff;
      color: var(--banda-danger);
      font-size: 11px;
      letter-spacing: .07em;
      cursor: pointer;
      transition: .18s ease;
    }
    .exit-box:hover {
      transform: translateY(-2px);
      border-color: rgba(166,79,69,.48);
      background: #fff9f8;
    }
    .exit-box:focus-visible,
    .note-btn:focus-visible,
    .new-example:focus-visible,
    .modal-btn:focus-visible,
    .modal-exit-btn:focus-visible {
      outline: 3px solid rgba(57,58,134,.16);
      outline-offset: 2px;
    }
    .board { padding: 10px; }
    .board-head {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 2px 8px;
      margin-bottom: 7px;
      border-bottom: 1px solid var(--banda-line);
    }
    .board-caption {
      color: var(--banda-muted);
      font-size: 12px;
      min-height: 14px;
    }
    .score-wrap {
      padding: 0 4px;
      border-radius: 16px;
      background: linear-gradient(145deg, #fff, #fdfbf6);
      border: 1px solid var(--banda-line);
    }
    svg#score { width: 100%; height: auto; display: block; }
    .caption {
      fill: #716c67;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .answers {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
    }
    .note-btn {
      min-width: 0;
      min-height: 50px;
      padding: 8px 4px;
      border: 1px solid rgba(139,98,40,.18);
      border-radius: 14px;
      background: var(--banda-gold);
      color: #ffffff;
      font-family: var(--banda-font-title);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(73,58,35,.085);
      transition: .18s ease;
      opacity: 0;
      transform: translateY(10px) scale(.98);
    }
    .note-btn.visible { animation: answerIn .44s cubic-bezier(.22,.8,.24,1) forwards; }
    .note-btn:hover {
      transform: translateY(-2px);
      background: #c89f52;
      border-color: rgba(139,98,40,.28);
    }
    .note-btn.correct {
      background: var(--result-good);
      border-color: var(--result-good);
      color: #ffffff;
    }
    .note-btn.wrong {
      background: var(--banda-danger);
      border-color: var(--banda-danger);
      color: #ffffff;
    }
    .note-btn:disabled { cursor: default; }
    .status {
      min-height: 48px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--banda-muted);
      font-size: 16px;
      font-weight: 700;
      border-radius: 17px;
    }
    .dev-actions { display: flex; justify-content: center; padding: 0 0 2px; }
    .new-example {
      border: 0;
      background: transparent;
      color: var(--banda-blue);
      font-family: var(--banda-font-title);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      padding: 5px 8px;
      min-height: 14px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(32, 24, 20, .38);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .24s ease, visibility .24s ease;
      z-index: 100;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0;
      transform: scale(.8);
      transition: opacity .32s ease, transform .32s ease;
      pointer-events: none;
    }
    .modal-overlay.open .modal-glow {
      opacity: 1;
      transform: scale(1);
    }
    .modal-glow.success {
      background: radial-gradient(circle, rgba(47,141,98,.42) 0%, rgba(212,172,95,.16) 45%, rgba(47,141,98,0) 72%);
    }
    .modal-glow.error {
      background: radial-gradient(circle, rgba(166,79,69,.40) 0%, rgba(232,166,157,.20) 42%, rgba(166,79,69,0) 72%);
    }
    .modal-card {
      width: min(100%, 430px);
      min-height: 470px;
      background: #fff;
      border: 1px solid var(--banda-line);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(43, 30, 24, .14);
      padding: 18px 18px 16px;
      transform: translateY(14px) scale(.96);
      opacity: 0;
      transition: transform .26s ease, opacity .26s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .modal-card.success {
      background: linear-gradient(180deg, #ffffff 0%, #fbfffc 100%);
      border-color: rgba(47,141,98,.28);
      box-shadow: 0 0 0 1px rgba(47,141,98,.08), 0 18px 45px rgba(27,110,73,.18);
    }
    .modal-card.success::before {
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:7px;
      background: linear-gradient(90deg, #77d6a3 0%, #2f8d62 65%, #d4ac5f 100%);
    }
    .modal-card.error {
      background: linear-gradient(180deg, #ffffff 0%, #fff9f8 100%);
      border-color: rgba(166,79,69,.26);
      box-shadow: 0 0 0 1px rgba(166,79,69,.06), 0 18px 45px rgba(166,79,69,.18);
    }
    .modal-card.error::before {
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:7px;
      background: linear-gradient(90deg, #e8a69d 0%, #a64f45 80%);
    }
    .modal-badge {
      width: 76px;
      height: 76px;
      margin: 6px auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-family: var(--banda-font-title);
      position: relative;
    }
    .modal-card.success .modal-badge {
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f5fff9 35%, #dbf5e6 100%);
      color: var(--result-good-deep);
      font-size: 32px;
      box-shadow: 0 0 0 10px rgba(47,141,98,.10), 0 12px 28px rgba(47,141,98,.20);
      animation: happyPulse 1.1s ease infinite;
    }
    .modal-card.error .modal-badge {
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fff7f6 40%, #fde4df 100%);
      color: var(--banda-danger);
      font-size: 40px;
      box-shadow: 0 0 0 10px rgba(166,79,69,.10), 0 12px 28px rgba(166,79,69,.14);
    }
    .modal-title {
      margin: 0 0 10px;
      font-family: var(--banda-font-title);
      font-size: 32px;
      line-height: 1;
      font-weight: 700;
      min-height: 36px;
    }
    .modal-card.success .modal-title { color: var(--result-good-deep); }
    .modal-card.error .modal-title { color: var(--banda-danger); }
    .modal-text {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--banda-ink);
      min-height: 32px;
      text-align: center;
    }
    .modal-subtext {
      margin: 12px 0 0;
      font-size: 18px;
      line-height: 1.3;
      color: var(--banda-muted);
      font-weight: 700;
      min-height: 24px;
      text-align: center;
    }
    .modal-subtext2 {
      margin: 6px 0 0;
      font-size: 17px;
      line-height: 1.3;
      color: var(--banda-muted);
      font-weight: 700;
      min-height: 24px;
      text-align: center;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
      align-items: center;
    }
    .modal-btn {
      border: 2px solid rgba(212,172,95,.75);
      border-radius: 999px;
      min-height: 46px;
      padding: 11px 20px;
      background: var(--banda-blue);
      color: #fff;
      font-family: var(--banda-font-title);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(57,58,134,.18);
      transition: .18s ease;
      font-size: 14px;
      min-width: 180px;
    }
    .modal-btn:hover {
      transform: translateY(-2px);
      background: var(--banda-blue-deep);
    }
    .modal-exit-btn {
      border: 1px solid rgba(166,79,69,.25);
      border-radius: 14px;
      min-height: 38px;
      padding: 9px 14px;
      background: #fff;
      color: var(--banda-danger);
      font-family: var(--banda-font-title);
      font-size: 11px;
      letter-spacing: .07em;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
      min-width: 140px;
    }
    .modal-exit-btn:hover {
      transform: translateY(-1px);
      background: #fff9f8;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px) scale(.985);
      animation: revealIn .58s cubic-bezier(.22,.8,.24,1) forwards;
    }
    .delay-1 { animation-delay: .04s; }
    .delay-2 { animation-delay: .10s; }
    .delay-3 { animation-delay: .16s; }
    .delay-4 { animation-delay: .22s; }
    .delay-5 { animation-delay: .28s; }
    .typing-caret {
      border-right: 2px solid rgba(57,58,134,.65);
      padding-right: 1px;
    }
    @keyframes revealIn {
      0% { opacity: 0; transform: translateY(18px) scale(.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes answerIn {
      0% { opacity: 0; transform: translateY(10px) scale(.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .screen-shake {
      animation: screenShake .5s linear;
    }
    @keyframes screenShake {
      0% { transform: translate(0,0); }
      10% { transform: translate(-2px,1px); }
      20% { transform: translate(3px,-1px); }
      30% { transform: translate(-3px,2px); }
      40% { transform: translate(3px,1px); }
      50% { transform: translate(-2px,-2px); }
      60% { transform: translate(2px,2px); }
      70% { transform: translate(-3px,1px); }
      80% { transform: translate(2px,-1px); }
      90% { transform: translate(-1px,2px); }
      100% { transform: translate(0,0); }
    }
    @keyframes happyPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 10px rgba(47,141,98,.10), 0 12px 28px rgba(47,141,98,.20); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(47,141,98,.08), 0 14px 32px rgba(47,141,98,.24); }
    }

    @media (max-width: 560px) {
      body { padding: 8px; }
      .screen { gap: 8px; }
      .hero { padding: 11px 12px; border-radius: 20px; }
      .hero-row { grid-template-columns: minmax(0, 1fr) 118px; gap: 9px; }
      .brand { margin-bottom: 7px; font-size: 9px; }
      .title-row { gap: 8px; }
      .game-logo-icon { width: 40px; height: 40px; border-radius: 13px; }
      h1 { font-size: clamp(23px, 7vw, 29px); }
      .hero-copy { margin-top: 7px; gap: 4px; }
      .hero-sub-main { font-size: 12px; line-height: 1.32; min-height: 34px; }
      .hero-side { width: 118px; gap: 5px; }
      .points-box, .exit-box { min-height: 42px; border-radius: 14px; }
      .points-box { padding: 7px 5px; }
      .points-number { font-size: 36px; min-height: 36px; }
      .points-label { font-size: 9px; min-height: 10px; }
      .exit-box { font-size: 9px; padding: 5px; }
      .board { padding: 8px; border-radius: 20px; }
      .board-head { padding-bottom: 5px; margin-bottom: 4px; }
      .board-caption { font-size: 10px; min-height: 12px; }
      .score-wrap { padding: 0 2px; border-radius: 15px; }
      .answers { gap: 4px; }
      .note-btn { min-height: 44px; padding: 6px 1px; border-radius: 11px; font-size: 11px; }
      .status { min-height: 44px; padding: 9px 10px; font-size: 14px; }
      .new-example { font-size: 11px; }
      .modal-glow { width: 300px; height: 300px; }
      .modal-card { padding: 16px 14px 14px; border-radius: 20px; min-height: 420px; }
      .modal-badge { width: 62px; height: 62px; }
      .modal-card.success .modal-badge { font-size: 28px; }
      .modal-card.error .modal-badge { font-size: 36px; }
      .modal-title { font-size: 26px; min-height: 30px; }
      .modal-text { font-size: 18px; min-height: 28px; }
      .modal-subtext { font-size: 15px; min-height: 20px; }
      .modal-subtext2 { font-size: 14px; min-height: 20px; }
      .modal-btn { min-width: 160px; }
    }

    @media (max-width: 370px) {
      .hero-row { grid-template-columns: minmax(0,1fr) 103px; }
      .hero-side { width: 103px; }
      .game-logo-icon { width: 36px; height: 36px; }
      h1 { font-size: 22px; }
      .note-btn { font-size: 10px; letter-spacing: -.01em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
      .reveal { opacity: 1 !important; transform: none !important; }
      .note-btn { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
<main class="screen">
  <section class="game-card hero reveal delay-1">
    <div class="hero-row">
      <div class="hero-main">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brandText"></span></div>
        <div class="title-row">
          <div class="game-logo-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 32 32">
              <path d="M11 7.2v14.1" fill="none" stroke="#393A86" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M20.8 5.1v13.1" fill="none" stroke="#8B6228" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M11 7.2l9.8-2.1v4.1L11 11.3V7.2Z" fill="none" stroke="#393A86" stroke-width="1.7" stroke-linejoin="round"/>
              <ellipse cx="8.6" cy="22.2" rx="3.9" ry="2.8" transform="rotate(-18 8.6 22.2)" fill="#D4AC5F"/>
              <ellipse cx="18.4" cy="19.2" rx="3.9" ry="2.8" transform="rotate(-18 18.4 19.2)" fill="#393A86"/>
            </svg>
          </div>
          <h1 id="titleText"></h1>
        </div>
        <div class="hero-copy">
          <div class="hero-sub-main" id="heroSubMain"></div>
        </div>
      </div>
      <aside class="hero-side" aria-label="Puntuació i sortida">
        <div class="points-box">
          <div class="points-number" id="pointsNumber">0</div>
          <div class="points-label" id="pointsLabel"></div>
        </div>
        <button class="exit-box" id="exitGame" type="button"></button>
      </aside>
    </div>
  </section>

  <section class="game-card board reveal delay-2" aria-label="Taulell del joc">
    <div class="board-head"><div class="board-caption" id="boardCaption"></div></div>
    <div class="score-wrap">
      <svg id="score" viewBox="0 0 760 340" role="img" aria-label="Pentagrama amb una nota musical">
        <rect x="0" y="0" width="760" height="340" rx="18" fill="#fff"/>
        <g id="staff"></g>
        <g id="clef"></g>
        <g id="accidental"></g>
        <g id="ledger"></g>
        <g id="note"></g>
        <text id="clefLabel" x="380" y="308" text-anchor="middle" class="caption"></text>
      </svg>
    </div>
  </section>

  <section class="answers reveal delay-3" id="answers" aria-label="Opcions de resposta"></section>
  <div class="game-card status reveal delay-4" id="status" aria-live="polite"></div>
</main>

<div class="modal-overlay" id="resultModal" aria-hidden="true">
  <div class="modal-glow" id="modalGlow"></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-badge" id="modalBadge">✓</div>
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-text" id="modalText"></p>
    <p class="modal-subtext" id="modalSubtext"></p>
    <p class="modal-subtext2" id="modalSubtext2"></p>
    <div class="modal-actions">
      <button class="modal-btn" id="closeModal" type="button"></button>
      <button class="modal-exit-btn" id="modalExit" type="button"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const svgNS = "http://www.w3.org/2000/svg";
  const staff = document.getElementById("staff");
  const clef = document.getElementById("clef");
  const accidental = document.getElementById("accidental");
  const ledger = document.getElementById("ledger");
  const note = document.getElementById("note");
  const clefLabel = document.getElementById("clefLabel");
  const answers = document.getElementById("answers");
  const status = document.getElementById("status");
  const exitGame = document.getElementById("exitGame");

  const brandText = document.getElementById("brandText");
  const titleText = document.getElementById("titleText");
  const heroSubMain = document.getElementById("heroSubMain");
  const pointsBox = document.querySelector(".points-box");
  const pointsNumber = document.getElementById("pointsNumber");
  const pointsLabel = document.getElementById("pointsLabel");
  const boardCaption = document.getElementById("boardCaption");

  const resultModal = document.getElementById("resultModal");
  const modalGlow = document.getElementById("modalGlow");
  const modalCard = document.getElementById("modalCard");
  const modalBadge = document.getElementById("modalBadge");
  const modalTitle = document.getElementById("modalTitle");
  const modalText = document.getElementById("modalText");
  const modalSubtext = document.getElementById("modalSubtext");
  const modalSubtext2 = document.getElementById("modalSubtext2");
  const closeModal = document.getElementById("closeModal");
  const modalExit = document.getElementById("modalExit");

  const names = ["DO","RE","MI","FA","SOL","LA","SI"];
  const letterIndex = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};
  const ca = {C:"DO",D:"RE",E:"MI",F:"FA",G:"SOL",A:"LA",B:"SI"};
  const INTRO = { lineDuration: 600, lineGap: 300, noteFade: 2000, clefFade: 600, answerGap: 200 };
  const EMBEDDED = window.self !== window.top;
  const REDUCED = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;
  let initData=null, challenge=null, registeredUser=false, pointsTotal=0, answerLocked=true, selectedAnswer='', entryComplete=false;

  const audioIntro=new Audio('assets/AUDIO/QNE_intro.mp3');
  const audioBg=new Audio('assets/AUDIO/QNE_BGmusic.mp3');
  const audioCorrect=new Audio('assets/AUDIO/QNE_correcte.mp3');
  const audioError=new Audio('assets/AUDIO/QNE_error.mp3');
  audioBg.loop=true;
  [audioIntro,audioBg,audioCorrect,audioError].forEach(a=>{a.preload='auto';a.volume=1;});
  let audioUnlockPending=false,introFinished=false;
  function safePlay(a){try{const promise=a.play();promise?.catch?.(()=>{audioUnlockPending=true;});}catch(_error){audioUnlockPending=true;}}
  function stopAudio(){[audioIntro,audioBg,audioCorrect,audioError].forEach(a=>{try{a.pause();a.currentTime=0;}catch(_error){}});}
  function startBg(){if(introFinished)return;introFinished=true;try{audioBg.currentTime=0;}catch(_error){}safePlay(audioBg);}
  function startAudioSequence(){stopAudio();introFinished=false;try{audioIntro.currentTime=0;}catch(_error){}safePlay(audioIntro);}
  audioIntro.addEventListener('ended',startBg);
  audioIntro.addEventListener('error',()=>{if(audioIntro.error?.code===3||!introFinished)startBg();});
  audioBg.addEventListener('error',()=>{if(audioBg.error?.code===3){try{audioBg.currentTime=0;}catch(_error){}safePlay(audioBg);}});
  function setMuted(value){[audioIntro,audioBg,audioCorrect,audioError].forEach(a=>a.muted=!!value);}
  function unlockAudio(){if(!audioUnlockPending)return;audioUnlockPending=false;safePlay(introFinished?audioBg:audioIntro);}
  document.addEventListener('pointerdown',unlockAudio,{passive:true});
  document.addEventListener('keydown',unlockAudio);
  function post(payload){if(EMBEDDED)window.parent.postMessage(payload,'*');}
  const GLOBAL_SHIFT_X = 8;
  const GLOBAL_SHIFT_Y = -10;
  const clefs = [
    {id:"treble", glyph:"𝄞", label:"CLAU DE SOL", short:"SOL", bottom:"E", size:174, x:98 + GLOBAL_SHIFT_X, y:240},
    {id:"bass", glyph:"𝄢", label:"CLAU DE FA", short:"FA", bottom:"G", size:130, x:104 + GLOBAL_SHIFT_X, y:211 + GLOBAL_SHIFT_Y},
    {id:"alto", glyph:"𝄡", label:"CLAU DE DO", short:"DO", bottom:"F", size:152, x:102 + GLOBAL_SHIFT_X, y:238 + GLOBAL_SHIFT_Y}
  ];
  const accidentalChoices = [
    {glyph:"", label:""},
    {glyph:"♯", label:" sostingut"},
    {glyph:"♭", label:" bemoll"}
  ];

  function sleep(ms){ return new Promise(resolve => setTimeout(resolve, REDUCED?0:ms)); }
  function el(name, attrs={}) {
    const n = document.createElementNS(svgNS, name);
    Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v));
    return n;
  }
  function clear(node) { while(node.firstChild) node.removeChild(node.firstChild); }
  function naturalLetter(bottom, step) {
    const letters = ["C","D","E","F","G","A","B"];
    let i = letterIndex[bottom] + step;
    i = ((i % 7) + 7) % 7;
    return letters[i];
  }

  async function typeText(target, text, speed=24, addCaret=false) {
    if (!target) return;
    target.textContent = "";
    target.classList.remove("typing-caret");
    if(REDUCED){target.textContent=text;return;}
    if (addCaret) target.classList.add("typing-caret");
    for (let i = 0; i < text.length; i++) {
      target.textContent += text[i];
      await sleep(speed);
    }
    if (addCaret) {
      await sleep(120);
      target.classList.remove("typing-caret");
    }
  }

  function animateCounter(target, from, to, duration=1200) {
    return new Promise(resolve => {
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const value = Math.round(from + (to - from) * eased);
        target.textContent = value;
        if (p < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  function doExit() {
    stopAudio();
    if(EMBEDDED) {
      post({ type: "BANDA_DE_LA_CALA_MINIGAME_EXIT", game: "QUINA_NOTA_ES" });
      status.textContent = "Tornant al menú de minijocs…";
    } else {
      status.textContent = "Minijoc tancat. Pots tancar aquesta pestanya.";
    }
  }

  async function introTexts() {
    typeText(brandText, "BANDA DE LA CALA · MINIJOC DIARI", 16, true);
    await sleep(130);
    typeText(titleText, "QUINA NOTA ÉS?", 26, true);
    await sleep(180);
    typeText(heroSubMain, "Observa el pentagrama, identifica la nota i tria la resposta correcta. Tens un únic intent. Si l’encertes, guanyes +1 punt.", 14, true);
    await sleep(100);
    if(pointsBox) pointsBox.hidden=!registeredUser;
    if(registeredUser){
      typeText(pointsLabel, "PUNTS MUSICALS", 18, true);
      animateCounter(pointsNumber, 0, pointsTotal, 1300);
    }else{
      pointsNumber.textContent="";
      pointsLabel.textContent="";
    }
    typeText(exitGame, "SURT DEL JOC", 20, true);
    if(boardCaption) boardCaption.textContent="";
  }

  function triggerScreenShake() {
    document.body.classList.remove("screen-shake");
    void document.body.offsetWidth;
    document.body.classList.add("screen-shake");
    setTimeout(() => document.body.classList.remove("screen-shake"), 500);
  }

  function drawStaff() {
    clear(staff);
    const y0 = 120, gap = 25;
    for(let i=0; i<5; i++) {
      const line = el("line", { x1:60, y1:y0+i*gap, x2:700, y2:y0+i*gap, stroke:"#24211F", "stroke-width":"2.2", "stroke-linecap":"round" });
      line.classList.add("staff-line");
      staff.appendChild(line);
    }
  }

  function prepareLineAnimation() {
    const lines = staff.querySelectorAll(".staff-line");
    lines.forEach((line, index) => {
      const len = line.getTotalLength ? line.getTotalLength() : 640;
      line.style.strokeDasharray = String(len);
      line.style.strokeDashoffset = String(len);
      line.style.animation = `lineDraw ${INTRO.lineDuration}ms ease forwards`;
      line.style.animationDelay = `${index * INTRO.lineGap}ms`;
    });
    if(!document.getElementById("dynamicLineDrawStyle")) {
      const style = document.createElement("style");
      style.id = "dynamicLineDrawStyle";
      style.textContent = `@keyframes lineDraw { from { stroke-dashoffset: 640; } to { stroke-dashoffset: 0; } }`;
      document.head.appendChild(style);
    }
  }

  function openResultModal(isCorrect, answer, awarded=0) {
    modalCard.className = "modal-card " + (isCorrect ? "success" : "error");
    modalGlow.className = "modal-glow " + (isCorrect ? "success" : "error");
    modalBadge.textContent = isCorrect ? "✓" : "!";
    resultModal.classList.add("open");
    resultModal.setAttribute("aria-hidden", "false");
    triggerScreenShake();
    safePlay(isCorrect ? audioCorrect : audioError);

    typeText(modalTitle, isCorrect ? "Correcte!" : "MÈU!", 24, true);
    typeText(modalText, isCorrect ? `La nota és ${answer}` : `La resposta correcta era ${answer}`, 18, true);
    typeText(modalSubtext, isCorrect ? "Molt bé!" : "No passa res!", 18, true);
    const tail=isCorrect
      ? (registeredUser && awarded>0 ? "Guanyes +1 punt musical!" : registeredUser ? "Aquest repte ja estava puntuat." : "Has encertat! Inicia sessió per guardar punts.")
      : (registeredUser ? "El pròxim repte arriba a les 03:00 🙂" : "Pots jugar, però sense sessió no es guarda el progrés.");
    typeText(modalSubtext2, tail, 16, true);
    typeText(closeModal, "D'ACORD", 22, true);
    typeText(modalExit, "SURT DEL JOC", 20, true);
  }

  function closeResultModal() {
    resultModal.classList.remove("open");
    resultModal.setAttribute("aria-hidden", "true");
  }

  async function animateMusicScene(chosenClef) {
    prepareLineAnimation();
    const totalStaffTime = INTRO.lineDuration + ((5 - 1) * INTRO.lineGap);
    await sleep(totalStaffTime + 40);

    note.style.opacity = "0";
    accidental.style.opacity = "0";
    ledger.style.opacity = "0";
    note.style.transition = `opacity ${INTRO.noteFade}ms ease`;
    accidental.style.transition = `opacity ${INTRO.noteFade}ms ease`;
    ledger.style.transition = `opacity ${INTRO.noteFade}ms ease`;
    note.style.opacity = "1";
    accidental.style.opacity = "1";
    ledger.style.opacity = "1";

    await sleep(INTRO.noteFade + 60);

    clef.style.opacity = "0";
    clef.style.transition = `opacity ${INTRO.clefFade}ms ease`;
    clef.style.opacity = "1";

    await sleep(INTRO.clefFade + 30);
    await typeText(clefLabel, chosenClef.label, 22, true);
  }

  async function revealAnswerButtons() {
    const buttons = answers.querySelectorAll(".note-btn");
    for (const btn of buttons) {
      btn.classList.add("visible");
      await typeText(btn, btn.dataset.fullText, 28, false);
      await sleep(INTRO.answerGap);
    }
    entryComplete=true;
    applyPlayedState();
  }

  function answerFor(ch){
    const c=clefs.find(item=>item.id===ch?.clef)||clefs[0];
    return ca[naturalLetter(c.bottom,Number(ch?.step||0))]||"DO";
  }

  function drawChallenge(ch) {
    drawStaff();
    clear(clef); clear(accidental); clear(ledger); clear(note);
    answers.innerHTML = ""; status.textContent = ""; clefLabel.textContent = ""; closeResultModal();

    const c = clefs.find(item=>item.id===ch?.clef) || clefs[0];
    const step = Number(ch?.step||0);
    const accGlyph = ch?.accidental==='sharp' ? '♯' : ch?.accidental==='flat' ? '♭' : '';
    const x = 485;
    const y = 220 - step*12.5;

    const clefText = el("text", {
      x:c.x, y:c.y, "font-size":c.size,
      "font-family":"'Bravura Text','Noto Music','Segoe UI Symbol','Arial Unicode MS',serif",
      fill:"#24211F", "text-rendering":"optimizeLegibility"
    });
    clefText.textContent = c.glyph;
    clef.appendChild(clefText);

    const evenSteps = [];
    if(step < 0) for(let s=-2; s>=step-(Math.abs(step)%2); s-=2) evenSteps.push(s);
    if(step > 8) for(let s=10; s<=step+(step%2); s+=2) evenSteps.push(s);
    evenSteps.forEach(s => {
      const ly = 220 - s*12.5;
      ledger.appendChild(el("line", { x1:x-31, y1:ly, x2:x+31, y2:ly, stroke:"#24211F", "stroke-width":"2.2", "stroke-linecap":"round" }));
    });

    if(accGlyph) {
      const accText = el("text", {
        x:x-60, y:y+13, "font-size":"44",
        "font-family":"'Bravura Text','Noto Music','Segoe UI Symbol','Times New Roman',serif",
        fill:"#24211F"
      });
      accText.textContent = accGlyph;
      accidental.appendChild(accText);
    }

    const head = el("ellipse", { cx:x, cy:y, rx:16, ry:11, fill:"#24211F", transform:`rotate(-18 ${x} ${y})` });
    note.appendChild(head);
    const stemUp = y >= 170;
    note.appendChild(el("line", {
      x1:stemUp ? x+14 : x-14, y1:y,
      x2:stemUp ? x+14 : x-14, y2:stemUp ? y-76 : y+76,
      stroke:"#24211F", "stroke-width":"4", "stroke-linecap":"round"
    }));

    note.style.opacity = "0";
    accidental.style.opacity = "0";
    ledger.style.opacity = "0";
    clef.style.opacity = "0";

    names.forEach(n => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "note-btn";
      b.textContent = "";
      b.dataset.fullText = n;
      b.dataset.note = n;
      b.disabled = true;
      b.addEventListener("click", () => chooseAnswer(n));
      answers.appendChild(b);
    });
    return c;
  }

  function applyPlayedState(){
    const buttons=[...document.querySelectorAll('.note-btn')];
    const already=registeredUser && !!initData?.dailyState?.alreadyPlayed;
    if(already){
      answerLocked=true;
      const expected=String(initData.dailyState.correctAnswer||answerFor(challenge)).toUpperCase();
      buttons.forEach(btn=>{btn.disabled=true;if(btn.dataset.note===expected)btn.classList.add('correct');});
      status.innerHTML=`<span class="played-badge">${initData.dailyState.correct===true?'✓':'•'} REPTE ACTUAL COMPLETAT · NOU REPTE A LES 03:00</span>`;
    }else{
      answerLocked=false;
      buttons.forEach(btn=>btn.disabled=false);
      status.textContent=registeredUser?'Tria una resposta.':'Tria una resposta · jugues sense marcador.';
    }
  }

  function chooseAnswer(answer){
    if(answerLocked || !entryComplete)return;
    answerLocked=true;
    selectedAnswer=answer;
    [...document.querySelectorAll('.note-btn')].forEach(btn=>btn.disabled=true);
    if(registeredUser && EMBEDDED){
      status.textContent='Comprovant resposta…';
      post({type:'BANDA_DE_LA_CALA_MINIGAME_RESULT',game:'QUINA_NOTA_ES',answer,cycleDate:initData?.dailyState?.date||''});
      return;
    }
    const expected=answerFor(challenge);
    resolveVisual({correct:answer===expected,correctAnswer:expected,pointsAwarded:0,pointsTotal});
  }

  function resolveVisual(result){
    const expected=String(result?.correctAnswer||answerFor(challenge)).toUpperCase();
    if(registeredUser){
      pointsTotal=Number(result?.pointsTotal??pointsTotal??0);
      pointsNumber.textContent=String(pointsTotal);
    }
    const isCorrect=result?.correct===true;
    const buttons=[...document.querySelectorAll('.note-btn')];
    buttons.forEach(btn=>{
      btn.disabled=true;
      btn.classList.remove('correct','wrong');
      if(btn.dataset.note===expected)btn.classList.add('correct');
    });
    if(!isCorrect)buttons.find(btn=>btn.dataset.note===selectedAnswer)?.classList.add('wrong');
    status.innerHTML=isCorrect
      ? `<strong>Correcte!${registeredUser&&Number(result?.pointsAwarded||0)>0?' +1 punt musical.':''}</strong>`
      : 'Repte completat. Nou repte a les 03:00.';
    openResultModal(isCorrect,expected,Number(result?.pointsAwarded||0));
  }

  function madridCycleDate(){
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const m=Object.fromEntries(parts.map(p=>[p.type,p.value]));
    const d=new Date(`${m.year}-${m.month}-${m.day}T12:00:00Z`);
    if(Number(m.hour)<3)d.setUTCDate(d.getUTCDate()-1);
    return d.toISOString().slice(0,10);
  }
  function hash32(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function standaloneChallenge(date){
    let seed=hash32(`${date}|BANDA_DE_LA_CALA|QUINA_NOTA_ES|standalone-v2`);
    const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const ids=['treble','bass','alto'];
    const id=ids[Math.floor(rand()*3)];
    const min=id==='treble'?-3:-2,max=id==='treble'?12:10;
    const step=min+Math.floor(rand()*(max-min+1));
    const prob=id==='treble'?.78:.36;
    const accidentalValue=rand()<prob?(rand()<.5?'sharp':'flat'):'none';
    return{date,clef:id,step,accidental:accidentalValue};
  }

  async function initialize(payload){
    if(initData)return;
    initData=payload||{};
    registeredUser=!!payload?.registered;
    setMuted(!!payload?.muted);
    pointsTotal=registeredUser?Number(payload?.pointsTotal??payload?.dailyState?.pointsTotal??0):0;
    challenge=payload?.dailyState?.challenge||standaloneChallenge(madridCycleDate());
    const chosen=drawChallenge(challenge);
    startAudioSequence();
    introTexts();
    await animateMusicScene(chosen);
    await revealAnswerButtons();
  }

  exitGame.addEventListener("click", doExit);
  modalExit.addEventListener("click", doExit);
  closeModal.addEventListener("click", closeResultModal);
  resultModal.addEventListener("click", (e) => { if(e.target === resultModal) closeResultModal(); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape" && resultModal.classList.contains("open")) closeResultModal(); });
  window.addEventListener('beforeunload',stopAudio);

  window.addEventListener('message',event=>{
    const data=event.data||{};
    if(data.game!=='QUINA_NOTA_ES')return;
    if(data.type==='BANDA_DE_LA_CALA_MINIGAME_INIT')initialize(data);
    else if(data.type==='BANDA_DE_LA_CALA_MINIGAME_INIT_ERROR')status.textContent=data.message||'No s’ha pogut carregar el repte.';
    else if(data.type==='BANDA_DE_LA_CALA_MINIGAME_RESULT_CONFIRMED')resolveVisual(data.result||{});
    else if(data.type==='BANDA_DE_LA_CALA_MINIGAME_RESULT_ERROR'){answerLocked=false;[...document.querySelectorAll('.note-btn')].forEach(btn=>btn.disabled=false);status.textContent=data.message||'No s’ha pogut desar el resultat.';}
    else if(data.type==='BANDA_DE_LA_CALA_MINIGAME_MUTE')setMuted(!!data.muted);
    else if(data.type==='BANDA_DE_LA_CALA_MINIGAME_STOP')stopAudio();
  });

  if(EMBEDDED){
    post({type:'BANDA_DE_LA_CALA_MINIGAME_READY',game:'QUINA_NOTA_ES'});
    status.textContent='Carregant repte…';
  }else{
    const date=madridCycleDate();
    initialize({registered:false,pointsTotal:0,dailyState:{date,challenge:standaloneChallenge(date),alreadyPlayed:false},muted:false});
  }
})();
</script>
</body>
</html>
